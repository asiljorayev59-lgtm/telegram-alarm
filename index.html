<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Alarm Pro</title>
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(13, 19, 33, 0.9);
            --neon-green: #00ff88;
            --neon-red: #ff3366;
            --neon-blue: #00f0ff;
            --text-color: #f3f4f6;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        .light-theme {
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #111827;
            --border-color: rgba(0, 0, 0, 0.1);
        }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: 0.3s;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .top-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        h2 { text-align: center; margin: 4px 0 10px 0; font-size: 18px; }
        h3 { color: var(--neon-blue); font-size: 12px; margin: 0 0 5px 0; text-transform: uppercase; }
        
        .status-wrapper {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .status-dropdown-btn {
            flex-grow: 1;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            background: rgba(255, 51, 102, 0.15);
            color: var(--neon-red);
            border: 1px solid rgba(255, 51, 102, 0.3);
            cursor: pointer;
            text-align: center;
        }
        .status-dropdown-btn.connected {
            background: rgba(0, 255, 136, 0.15);
            color: var(--neon-green);
            border-color: rgba(0, 255, 136, 0.3);
        }
        .add-session-btn {
            width: 36px;
            background: var(--neon-blue);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        #sessionDropdownPanel {
            display: none;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
        }

        .clock {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            color: var(--neon-blue);
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
            transition: 0.2s;
        }
        .btn-alarm { background: var(--neon-red); color: white; }
        .btn-primary { background: var(--neon-blue); color: #000; }
        .btn-success { background: var(--neon-green); color: #000; }
        .btn-danger { background: rgba(255, 51, 102, 0.2); color: var(--neon-red); border: 1px solid rgba(255, 51, 102, 0.4); font-size: 11px; padding: 4px 6px; width: auto; margin-top: 0; }
        
        button:hover { opacity: 0.9; }
        
        input, select {
            width: 100%;
            padding: 9px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 12px;
        }
        .section {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 5px 8px;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 11px;
        }
        #alarmModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 17, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #alarmModal h1 { color: var(--neon-red); font-size: 24px; margin-bottom: 10px; }
        #alarmModal p { font-size: 13px; margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; width: 100%; max-width: 360px; max-height: 160px; overflow-y: auto; text-align: left; color: #fff;}
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="top-btn" onclick="toggleLang()" id="langBtn">РУС / UZB</button>
        <h2 id="uiTitle">🚨 Alarm Pro</h2>
        <button class="top-btn" onclick="toggleTheme()">☀️/🌙</button>
    </div>
    
    <div class="status-wrapper">
        <div id="connectionStatusBtn" class="status-dropdown-btn" onclick="toggleSessionPanel()">
            Telegram Ulanmagan (0)
        </div>
        <button class="add-session-btn" onclick="toggleSessionPanel()">+</button>
    </div>

    <div id="sessionDropdownPanel">
        <h3 id="uiNumTitle">Raqamlar (Max 3)</h3>
        <div id="sessionList"></div>
        
        <div id="authBox" style="margin-top: 6px;">
            <input type="text" id="phoneNumber" placeholder="+998901234567">
            <button class="btn-success" id="uiSendCode" onclick="sendCode()">Kod yuborish</button>
        </div>

        <div id="verifyBox" style="display:none; margin-top: 6px;">
            <input type="text" id="smsCode" placeholder="SMS Kod">
            <input type="password" id="twoFA" placeholder="2FA Parol">
            <button class="btn-success" id="uiVerify" onclick="verifyCode()">Tasdiqlash</button>
        </div>
    </div>
    
    <div class="clock" id="clock">00:00:00</div>

    <button class="btn-alarm" id="uiStop" onclick="stopAlarm()">🔴 TO'XTATISH / STOP</button>
    <button class="btn-primary" id="uiTest" onclick="testAlarm()">🔔 Sinov / Test</button>

    <div class="section">
        <h3 id="uiSoundTitle">Musiqa & Ovoz</h3>
        <select id="alarmSoundSelect" onchange="changeAlarmSource()">
            <option value="builtin" id="optBuiltin">Siren (Ichki)</option>
            <option value="custom" id="optCustom">MP3 Fayl yuklash</option>
        </select>
        <input type="file" id="mp3FileInput" accept="audio/mp3, audio/*" style="display:none; font-size:11px;" onchange="loadCustomMp3(this)">
        <div id="mp3Status" style="font-size: 10px; color: var(--neon-green); margin-top: 2px;"></div>
    </div>

    <div class="section">
        <h3 id="uiChannelTitle">Kanallar</h3>
        <input type="text" id="channelInput" placeholder="Kanal ID (-100...)">
        <button class="btn-primary" id="uiAddChan" onclick="addChannel()">Qo'shish</button>
        <div id="channelList" style="margin-top: 4px;"></div>
    </div>
</div>

<div id="alarmModal">
    <h1 id="uiAlertTitle">🚨 YANGI XABAR!</h1>
    <p id="alarmTextContent">...</p>
    <button class="btn-alarm" style="max-width: 250px;" id="uiModalStop" onclick="stopAlarm()">TO'XTATISH</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentLang = 'uz';

    const translations = {
        uz: {
            title: "🚨 Alarm Pro",
            notConnected: "Telegram Ulanmagan (0)",
            connected: "Telegram Ulangan",
            numTitle: "Ulangan Raqamlar (Max 3)",
            sendCode: "Kod yuborish",
            verify: "Tasdiqlash",
            stop: "🔴 TO'XTATISH",
            test: "🔔 Sinov",
            soundTitle: "Musiqa & Ovoz",
            builtin: "Siren (Ichki)",
            custom: "MP3 Fayl yuklash",
            channelTitle: "Kanallar",
            addChan: "Qo'shish",
            alertTitle: "🚨 YANGI XABAR!",
            del: "O'chirish"
        },
        ru: {
            title: "🚨 Alarm Pro",
            notConnected: "Telegram не подключен (0)",
            connected: "Telegram Подключен",
            numTitle: "Номера (Макс 3)",
            sendCode: "Отправить код",
            verify: "Подтвердить",
            stop: "🔴 ОСТАНОВИТЬ",
            test: "🔔 Тест",
            soundTitle: "Музыка и Звук",
            builtin: "Сирена (Встроенная)",
            custom: "Загрузить MP3",
            channelTitle: "Каналы",
            addChan: "Добавить",
            alertTitle: "🚨 НОВОЕ СООБЩЕНИЕ!",
            del: "Удалить"
        }
    };

    function toggleLang() {
        currentLang = currentLang === 'uz' ? 'ru' : 'uz';
        updateTexts();
    }

    function updateTexts() {
        const t = translations[currentLang];
        document.getElementById('uiTitle').innerText = t.title;
        document.getElementById('uiNumTitle').innerText = t.numTitle;
        document.getElementById('uiSendCode').innerText = t.sendCode;
        document.getElementById('uiVerify').innerText = t.verify;
        document.getElementById('uiStop').innerText = t.stop;
        document.getElementById('uiTest').innerText = t.test;
        document.getElementById('uiSoundTitle').innerText = t.soundTitle;
        document.getElementById('optBuiltin').innerText = t.builtin;
        document.getElementById('optCustom').innerText = t.custom;
        document.getElementById('uiChannelTitle').innerText = t.channelTitle;
        document.getElementById('uiAddChan').innerText = t.addChan;
        document.getElementById('uiAlertTitle').innerText = t.alertTitle;
        document.getElementById('uiModalStop').innerText = t.stop;
    }

    function toggleTheme() {
        document.body.classList.toggle('light-theme');
    }

    let audioCtx = null;
    let oscillator = null;
    let isPlaying = false;
    let customAudioElement = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedMp3 = localStorage.getItem('custom_alarm_mp3');
        if (savedMp3) {
            customAudioElement = new Audio(savedMp3);
            customAudioElement.loop = true;
            document.getElementById('alarmSoundSelect').value = 'custom';
            document.getElementById('mp3FileInput').style.display = 'block';
            document.getElementById('mp3Status').innerText = '✅ MP3 tayyor';
        }
    });

    function toggleSessionPanel() {
        const panel = document.getElementById('sessionDropdownPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function changeAlarmSource() {
        const val = document.getElementById('alarmSoundSelect').value;
        const fileInput = document.getElementById('mp3FileInput');
        if (val === 'custom') {
            fileInput.style.display = 'block';
        } else {
            fileInput.style.display = 'none';
            customAudioElement = null;
            localStorage.removeItem('custom_alarm_mp3');
            document.getElementById('mp3Status').innerText = '';
        }
    }

    function loadCustomMp3(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const fileURL = URL.createObjectURL(file);
            customAudioElement = new Audio(fileURL);
            customAudioElement.loop = true;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('custom_alarm_mp3', e.target.result);
            };
            reader.readAsDataURL(file);
            document.getElementById('mp3Status').innerText = '✅ MP3 yuklandi!';
        }
    }

    function playAlarmSound() {
        if (isPlaying) return;
        isPlaying = true;
        if (customAudioElement) {
            customAudioElement.play().catch(e => console.log(e));
            return;
        }
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            const interval = setInterval(() => {
                if (!isPlaying) { clearInterval(interval); return; }
                if (audioCtx && oscillator) {
                    oscillator.frequency.exponentialRampToValueAtTime(1300, audioCtx.currentTime + 0.4);
                    oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.8);
                }
            }, 800);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        } catch (e) {}
    }

    function stopAlarm() {
        isPlaying = false;
        if (oscillator) { try { oscillator.stop(); } catch(e){} }
        if (audioCtx) { try { audioCtx.close(); } catch(e){} }
        if (customAudioElement) { customAudioElement.pause(); customAudioElement.currentTime = 0; }
        document.getElementById('alarmModal').style.display = 'none';
    }

    function testAlarm() {
        playAlarmSound();
        document.getElementById('alarmTextContent').innerText = "Test message / Sinov";
        document.getElementById('alarmModal').style.display = 'flex';
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    socket.on('telegram_status', (data) => {
        const btn = document.getElementById('connectionStatusBtn');
        const t = translations[currentLang];
        if (data.connected) {
            btn.innerText = `${t.connected} (${data.count} / 3)`;
            btn.classList.add('connected');
        } else {
            btn.innerText = t.notConnected;
            btn.classList.remove('connected');
        }

        let listHtml = '';
        if (data.sessions && data.sessions.length > 0) {
            data.sessions.forEach(phone => {
                listHtml += `<div class="item-row"><span>📱 ${phone}</span> <button class="btn-danger" onclick="logoutSession('${phone}')">${t.del}</button></div>`;
            });
        } else {
            listHtml = '<div style="font-size:10px; opacity:0.6; text-align:center;">Bo\'sh</div>';
        }
        document.getElementById('sessionList').innerHTML = listHtml;
    });

    socket.on('telegram_alarm', (data) => {
        playAlarmSound();
        document.getElementById('alarmTextContent').innerText = `Kanal: ${data.chatId}\n\n${data.text}`;
        document.getElementById('alarmModal').style.display = 'flex';

        if (Notification.permission === "granted") {
            navigator.serviceWorker.ready.then(reg => {
                reg.showNotification(`🚨 Yangi xabar!`, {
                    body: data.text,
                    icon: 'https://cdn-icons-png.flaticon.com/512/565/565547.png',
                    vibrate: [500, 200, 500, 200, 500],
                    requireInteraction: true
                });
            });
        }
    });

    if (Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    async function sendCode() {
        const phone = document.getElementById('phoneNumber').value;
        const res = await fetch('/api/auth/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) {
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('verifyBox').style.display = 'block';
        }
    }

    async function verifyCode() {
        const code = document.getElementById('smsCode').value;
        const password = document.getElementById('twoFA').value;
        const res = await fetch('/api/auth/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, password })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) { location.reload(); }
    }

    async function logoutSession(phone) {
        if (!confirm(`O'chirishni tasdiqlaysizmi?`)) return;
        await fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
        });
        location.reload();
    }

    async function addChannel() {
        const chatId = document.getElementById('channelInput').value;
        if (!chatId) return;
        await fetch('/api/channels', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chatId })
        });
        document.getElementById('channelInput').value = '';
    }

    async function removeChannel(id) {
        if (!confirm("O'chirish?")) return;
        await fetch(`/api/channels/${id}`, { method: 'DELETE' });
    }

    socket.on('channels_updated', (chats) => {
        let html = '';
        const t = translations[currentLang];
        chats.forEach(id => {
            html += `<div class="item-row"><span>📢 ${id}</span> <button class="btn-danger" onclick="removeChannel(${id})">${t.del}</button></div>`;
        });
        document.getElementById('channelList').innerHTML = html;
    });
</script>

</body>
</html>
